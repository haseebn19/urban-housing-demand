# Database, from the environment that compose.yaml sets
spring.datasource.url=${DB_ADDRESS}/${DB_DATABASE}?autoReconnect=true&useSSL=true&requireSSL=false&allowPublicKeyRetrieval=false
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.minimum-idle=2

# database/scripts/setup.sql creates the schema, so Hibernate leaves it alone. Validating it would
# fail anyway, since MariaDB's TINYINT and YEAR columns are not the types Hibernate expects.
spring.jpa.hibernate.ddl-auto=none
# Hibernate does not query the database while starting, so it needs the dialect named
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Swagger UI, under /api so the frontend's proxy passes it through
springdoc.swagger-ui.path=/api/docs.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.api-docs.path=/api/v3/api-docs
