plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.10.4'
}

group = 'io.github.haseebn19'
version = '1.0'

base {
    archivesName = 'urban-housing-demand'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

jacoco {
    toolVersion = '0.8.15'
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Database driver (version managed by Spring Boot)
    runtimeOnly 'com.mysql:mysql-connector-j'

    // API documentation at /api/docs.html
    runtimeOnly 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.10.0'

    // Testing (JUnit and Mockito versions are managed by Spring Boot)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // In-memory database for integration tests
    testRuntimeOnly 'com.h2database:h2'
}

testing {
    suites {
        test {
            useJUnitJupiter()
        }
    }
}

test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
}

checkstyle {
    toolVersion = '14.3.0'
    configFile = file('config/checkstyle/checkstyle.xml')
}

tasks.withType(Checkstyle) {
    reports {
        xml.required = false
        html.required = true
    }
}

// Java formatting (google-java-format, AOSP style). `./gradlew spotlessApply` fixes it;
// `./gradlew check` fails if a file is not formatted.
spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat().aosp()
    }
}

// Only the runnable Spring Boot jar is built
tasks.named('jar') {
    enabled = false
}
